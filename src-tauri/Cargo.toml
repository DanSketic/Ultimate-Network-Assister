[package]
name = "ultimate-network-assister"
version = "1.5.1"
description = "Read-only survey and advisory console for Proxmox VE and UniFi Network estates."
authors = ["dansketic"]
license = "MIT"
repository = "https://github.com/DanSketic/Ultimate-Network-Assister"
edition = "2021"
rust-version = "1.85"

[lib]
# The lib target is what the mobile entry point and integration tests use;
# main.rs is a thin wrapper over it.
name = "ultimate_network_assister_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite in, so the installed app has no system dependency.
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP for the read-only collectors. TLS verification is replaced wholesale by
# certificate pinning (see tls.rs), so reqwest is built without any root store
# and without a default crypto provider — `ring` is selected explicitly because
# it needs no cmake or nasm on Windows.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "charset",
    "http2",
    "rustls-tls-manual-roots-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
# Secrets live in the Windows Credential Manager, never in our own database.
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1.53.1", features = ["io-util", "net", "time", "rt", "macros"] }
tauri-plugin-window-state = "2.4.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
